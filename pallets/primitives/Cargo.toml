[package]
authors = ["Borlaug Blockchain"]
edition = "2021"
name = "pallet-primitives"
version = "2.0.0"

[dependencies]
codec =  { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"]}
timestamp = { workspace = true}

polkadot-sdk = { workspace = true, default-features = false, features = ["runtime"] }

[features]
default = ["std"]
no_std = []
std = [
  "polkadot-sdk/std",
  "polkadot-sdk/sp-std",
  "polkadot-sdk/sp-runtime",
  "polkadot-sdk/frame-support",
  "polkadot-sdk/frame-system",
  "polkadot-sdk/sp-core",
  "serde/std",
  "codec/std",
  "timestamp/std",
]
