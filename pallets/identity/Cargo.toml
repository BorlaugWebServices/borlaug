[package]
authors = ["Borlaug Blockchain"]
edition = "2021"
name = "pallet-identity"
version = "2.0.0"

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
timestamp = { workspace = true }

polkadot-sdk = { workspace = true, default-features = false, features = ["runtime"] }

extrinsic-extra = { path = "../../traits/extrinsic_extra", default-features = false }
groups = { package = "pallet-groups", path = "../groups", default-features = false }
primitives = { package = "pallet-primitives", path = "../primitives", default-features = false }
pallet-insecure-randomness-collective-flip = { workspace = true }
utils = { path = "../utils", default-features = false }

[dev-dependencies]
chrono = { workspace = true }
pallet-balances = { workspace = true }
runtime = { package = "borlaug-runtime", path = "../../runtime", features = ["std", "grandpa_aura"] }
serde = { workspace = true }
settings = { package = "pallet-settings", path = "../settings", default-features = false }


[features]
default = ["std"]
runtime-benchmarks = [
    "polkadot-sdk/frame-benchmarking"
]
std = [
    "polkadot-sdk/std",
    "polkadot-sdk/sp-std",
    "polkadot-sdk/frame-support",
    "polkadot-sdk/frame-system",
    "polkadot-sdk/sp-runtime",
    "polkadot-sdk/sp-io",
    "polkadot-sdk/sp-core",
    "codec/std",
    "pallet-insecure-randomness-collective-flip/std",
    "timestamp/std",
    "primitives/std",
    "scale-info/std",
    "utils/std",
    "groups/std",
    "extrinsic-extra/std",
]
try-runtime = [
    "polkadot-sdk/try-runtime",
]