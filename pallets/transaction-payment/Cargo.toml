[package]
authors = ["Parity Technologies <admin@parity.io>"]
description = "FRAME pallet to manage transaction payments"
edition = "2021"
homepage = "https://substrate.dev"
license = "Apache-2.0"
name = "pallet-transaction-payment"
readme = "README.md"
repository = "https://github.com/paritytech/substrate/"
version = "43.0.0"


[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"],  workspace = true }
serde = { workspace = true, optional = true }

polkadot-sdk = { workspace = true, default-features = false, features = ["runtime"] }

groups = {package = "pallet-groups", path = "../groups", default-features = false}

[dev-dependencies]
polkadot-sdk = { workspace = true, features = ["node"] }

pallet-balances = { workspace = true }
runtime = {package = "borlaug-runtime", path = "../../runtime", features = ["std", "grandpa_aura"]}
serde_json = { workspace = true }
settings = {package = "pallet-settings", path = "../settings"}


[features]
default = ["std"]
std = [
  "polkadot-sdk/std",
  "polkadot-sdk/runtime",
  "polkadot-sdk/sp-std",
  "polkadot-sdk/sp-runtime",
  "polkadot-sdk/sp-io",
  "polkadot-sdk/sp-api",
  "polkadot-sdk/sp-core",
  "polkadot-sdk/frame-support",
  "polkadot-sdk/frame-system",
  "serde",
  "codec/std",
  "scale-info/std",
  "groups/std",
  "serde",
]
runtime-benchmarks = [
  "polkadot-sdk/runtime-benchmarks",
  "polkadot-sdk/frame-benchmarking",
  "polkadot-sdk/frame-support",
  "polkadot-sdk/frame-system",
  "pallet-balances/runtime-benchmarks",
  "polkadot-sdk/sp-runtime",
]
try-runtime = [
  "polkadot-sdk/try-runtime",
]