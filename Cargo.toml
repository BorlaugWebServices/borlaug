[package]
authors = ["Borlaug"]
build = "build.rs"
edition = "2021"
name = "Borlaug"
version = "0.0.1"

[profile.release]
panic = "unwind"

[[bin]]
name = "borlaug"
path = "src/main.rs"



[dependencies]
# third-party dependencies
clap = { version = "4.0.9", features = ["derive"] }
codec = { package = "parity-scale-codec", version = "3.6.1" }
futures = { version = "0.3.9", features = ["compat"] }
hex = "0.4"

serde = { version = "1.0.226", features = ["derive"] }
serde_json ={ version = "1.0.41" }
jsonrpsee = { workspace = true, features = ["server"] }

pallet-transaction-payment = { path = "pallets/transaction-payment" }

runtime = { package = "borlaug-runtime", path = "runtime" }

asset-registry-runtime-api = { path = "pallets/asset-registry-runtime-api" }
audits-runtime-api = { path = "pallets/audits-runtime-api" }
groups-runtime-api = { path = "pallets/groups-runtime-api" }
identity-runtime-api = { path = "pallets/identity-runtime-api" }
provenance-runtime-api = { path = "pallets/provenance-runtime-api" }
settings-runtime-api = { path = "pallets/settings-runtime-api" }
pallet-primitives = { path = "pallets/primitives", default-features = false }
pallet-transaction-payment-rpc = { path = "pallets/transaction-payment/rpc" }

chrono = { workspace = true,  features = ["serde"] }

polkadot-sdk = {  workspace = true, features = ["node"] }

[build-dependencies]
clap = { version = "4.0.9", optional = true }
clap_complete = { version = "4.0.2", optional = true }
polkadot-sdk = { workspace = true, features = ["substrate-build-script-utils"] }

[workspace]
members = ["runtime", "pallets/*"]

[workspace.dependencies]
codec = { package = "parity-scale-codec", version = "3.6.1", default-features = false }
chrono = "0.4"
scale-info = { version = "2.5.0", default-features = false, features = ["derive"] }
serde = { version = "1.0.226", default-features = false }
serde_json = { version = "1.0.41", default-features = false }
smallvec = "1.5.0"
hex = "0.4"
hex-literal = { version = "0.4.1" }
log = "0.4.17"
jsonrpsee = { version = "0.24",  features = ["client-core", "server", "macros"] }

polkadot-sdk = { git = "https://github.com/paritytech/polkadot-sdk", tag ="polkadot-v1.21.0", default-features = false }

pallet-insecure-randomness-collective-flip = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
timestamp = { package = "pallet-timestamp", git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-authorship = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-collective = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-membership = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-proxy = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-sudo = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-timestamp = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-treasury = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-aura = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-authority-discovery = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-babe = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-grandpa = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-im-online = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-offences = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-session = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-staking = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }
pallet-staking-reward-curve = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-v1.21.0", default-features = false }



[features]
cli = [
    "polkadot-sdk/sc-cli",
    "polkadot-sdk/frame-benchmarking-cli",
    "polkadot-sdk/sc-service",
    "clap",
    "clap_complete",
    "polkadot-sdk/substrate-build-script-utils",
]
default = ["cli","grandpa_aura"]
# use grandpa / babe consensus (chain must not be stopped)
grandpa_babe = [
    "polkadot-sdk/sp-consensus-babe",
    "polkadot-sdk/sc-consensus-babe-rpc",
    "polkadot-sdk/sc-consensus-babe",
    "polkadot-sdk/sc-consensus-grandpa",
    "runtime/grandpa_babe",
    "polkadot-sdk/sc-network"
]
# use grandpa / aura consensus
grandpa_aura = [
    "polkadot-sdk/sc-consensus-aura",
    "polkadot-sdk/sc-consensus-grandpa",
    "polkadot-sdk/sp-consensus-aura",
    "polkadot-sdk/sc-network"
]
# use instant seal consensus - useful for development, but not to be used in production
instant_seal = [
    "polkadot-sdk/sc-consensus-manual-seal",
    "runtime/instant_seal",
]
runtime-benchmarks = [
    "runtime/runtime-benchmarks",
    "polkadot-sdk/runtime-benchmarks",
    "polkadot-sdk/frame-benchmarking-cli",
]
try-runtime = [
    "runtime/try-runtime",
    "polkadot-sdk/try-runtime",
]

