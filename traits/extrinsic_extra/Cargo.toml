[package]
authors = ["Borlaug Blockchain"]
description = "A trait that supplies a customizable extra fixed weight for extrinsics"
edition = "2021"
name = "extrinsic-extra"
version = "2.0.0"

[dependencies]
polkadot-sdk = { workspace = true, default-features = false }

[features]
default = ['std']
std = [
    "polkadot-sdk/std",
    "polkadot-sdk/frame-support",
]
