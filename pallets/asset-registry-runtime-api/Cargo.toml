[package]
authors = ["Borlaug"]
edition = "2021"
name = "asset-registry-runtime-api"
version = "0.0.1"

[dependencies]
codec = { workspace = true }
primitives = {package = "pallet-primitives", path = "../primitives", default-features = false}

polkadot-sdk = { workspace = true, default-features = false, features = ["runtime"] }

[features]
default = ["std"]
std = [
  "polkadot-sdk/std",
  "polkadot-sdk/sp-std",
  "polkadot-sdk/sp-api",
  "polkadot-sdk/frame-support",
  "codec/std",
  "primitives/std",
]
