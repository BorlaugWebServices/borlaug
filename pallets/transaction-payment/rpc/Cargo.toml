[package]
authors = ["Parity Technologies <admin@parity.io>"]
description = "RPC interface for the transaction payment pallet."
edition = "2021"
homepage = "https://substrate.io"
license = "Apache-2.0"
name = "pallet-transaction-payment-rpc"
readme = "README.md"
repository = "https://github.com/paritytech/substrate/"
version = "4.0.0-dev"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec ={ workspace = true }
jsonrpsee = { workspace = true,  features = ["client-core", "server", "macros"] }

polkadot-sdk = { workspace = true, default-features = false, features = ["runtime"] }

pallet-transaction-payment-rpc-runtime-api = {path = "runtime-api", default-features = false}



[features]
default = ["std"]
std = [
    "polkadot-sdk/std",
    "polkadot-sdk/runtime",
    "polkadot-sdk/sp-api",
    "polkadot-sdk/sp-core",
    "polkadot-sdk/sp-runtime",
    "polkadot-sdk/sp-weights",
    "codec/std",
]
