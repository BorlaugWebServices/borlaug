[package]
authors = ["Parity Technologies <admin@parity.io>"]
description = "RPC runtime API for transaction payment FRAME pallet"
edition = "2021"
homepage = "https://substrate.io"
license = "Apache-2.0"
name = "pallet-transaction-payment-rpc-runtime-api"
readme = "README.md"
repository = "https://github.com/paritytech/substrate/"
version = "4.0.0-dev"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec ={ workspace = true }

polkadot-sdk = { workspace = true, default-features = false, features = ["runtime", "sp-api", "sp-std", "sp-weights", "sp-runtime"] }

pallet-transaction-payment = {  path = "../../../transaction-payment", default-features = false }


[features]
default = ["std"]
std = [
    "polkadot-sdk/std",
    "polkadot-sdk/sp-std",
    "polkadot-sdk/runtime",
    "polkadot-sdk/sp-api",
    "polkadot-sdk/sp-runtime",
    "polkadot-sdk/sp-weights",
    "codec/std",
    "pallet-transaction-payment/std",
]
