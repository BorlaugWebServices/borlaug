[package]
authors = ["Borlaug Blockchain"]
edition = "2021"
name = "pallet-groups"
version = "2.0.0"

[dependencies]
codec = { workspace = true }
primitives = {package = "pallet-primitives", path = "../primitives", default-features = false}
scale-info = { workspace = true }

polkadot-sdk = { workspace = true, default-features = false, features = ["runtime"] }

extrinsic-extra = {path = "../../traits/extrinsic_extra", default-features = false}
group-info = {path = "../../traits/group_info", default-features = false}

[dev-dependencies]
chrono = { workspace = true }
pallet-balances = { workspace = true }
runtime = {package = "borlaug-runtime", path = "../../runtime", features = ["std", "grandpa_aura"]}
serde = { workspace = true }
settings = {package = "pallet-settings", path = "../settings"}


[features]
default = ["std"]
runtime-benchmarks = [
  "polkadot-sdk/frame-benchmarking",
  "polkadot-sdk/sp-core-hashing"
]
std = [
  "polkadot-sdk/std",
  "polkadot-sdk/runtime",
  "polkadot-sdk/sp-api",
  "polkadot-sdk/sp-std",
  "polkadot-sdk/frame-support",
  "polkadot-sdk/frame-system",
  "polkadot-sdk/sp-runtime",
  "polkadot-sdk/sp-core-hashing",
  "polkadot-sdk/sp-io",
  "codec/std",
  "scale-info/std",
  "primitives/std",
  "group-info/std",
  "extrinsic-extra/std",
]
try-runtime = [
  "polkadot-sdk/try-runtime",
]