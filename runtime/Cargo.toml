[package]
authors = ["Borlaug Blockchain"]
edition = "2021"
name = "borlaug-runtime"
version = "2.0.0"

[dependencies]
# third-party dependencies
codec = { workspace = true }
scale-info = { workspace = true }
serde = {workspace = true, features = ["derive"]}

polkadot-sdk = { workspace = true, default-features = false, features = ["runtime"] }

pallet-authorship =  { workspace = true }
pallet-balances =  { workspace = true }
pallet-collective =  { workspace = true }
pallet-insecure-randomness-collective-flip =  { workspace = true }
pallet-membership =  { workspace = true }
pallet-proxy =  { workspace = true }
pallet-sudo =  { workspace = true }
pallet-timestamp =  { workspace = true }
pallet-treasury = { workspace = true }

# grandpa/babe/aura dependencies

pallet-aura = { workspace = true, optional = true}
pallet-authority-discovery = { workspace = true, optional = true}
pallet-babe = { workspace = true, optional = true}
pallet-grandpa =  { workspace = true, optional = true}
pallet-im-online =  { workspace = true, optional = true}
pallet-offences =  { workspace = true, optional = true}
pallet-session = { workspace = true, optional = true}
pallet-staking = { workspace = true, optional = true}
pallet-staking-reward-curve =  { workspace = true, optional = true}

hex-literal = {workspace = true , optional = true}

# Borlaug Dependencies
asset-registry = {package = "pallet-asset-registry", path = "../pallets/asset-registry", default-features = false}
asset-registry-runtime-api = {path = "../pallets/asset-registry-runtime-api", default-features = false}
audits = {package = "pallet-audits", path = "../pallets/audits", default-features = false}
audits-runtime-api = {path = "../pallets/audits-runtime-api", default-features = false}
groups = {package = "pallet-groups", path = "../pallets/groups", default-features = false}
groups-runtime-api = {path = "../pallets/groups-runtime-api", default-features = false}
identity = {package = "pallet-identity", path = "../pallets/identity", default-features = false}
identity-runtime-api = {path = "../pallets/identity-runtime-api", default-features = false}
log = { workspace = true }
pallet-primitives = { path = "../pallets/primitives", default-features = false}
provenance = {package = "pallet-provenance", path = "../pallets/provenance", default-features = false}
provenance-runtime-api = {path = "../pallets/provenance-runtime-api", default-features = false}
settings = {package = "pallet-settings", path = "../pallets/settings", default-features = false}
settings-runtime-api = {path = "../pallets/settings-runtime-api", default-features = false}

pallet-transaction-payment = { path = "../pallets/transaction-payment", default-features = false}
pallet-transaction-payment-rpc-runtime-api = {path = "../pallets/transaction-payment/rpc/runtime-api", default-features = false}


[dependencies.substrate-validator-set]
default-features = false
path = "../../substrate-validator-set"

[build-dependencies]
polkadot-sdk = { workspace = true, features = ["substrate-wasm-builder"] }

[features]
default = ["std","grandpa_aura"]
no_std = []
std = [
  "polkadot-sdk/std",
  "polkadot-sdk/runtime",
  "polkadot-sdk/sp-api",
  "polkadot-sdk/sp-authority-discovery",
  "polkadot-sdk/sp-consensus-aura",
  "polkadot-sdk/sp-consensus-babe",
  "polkadot-sdk/sp-consensus-grandpa",
  "polkadot-sdk/sp-core",
  "polkadot-sdk/sp-inherents",
  "polkadot-sdk/sp-offchain",
  "polkadot-sdk/sp-runtime",
  "polkadot-sdk/sp-session",
  "polkadot-sdk/sp-std",
  "polkadot-sdk/sp-timestamp",
  "polkadot-sdk/sp-transaction-pool",
  "polkadot-sdk/sp-version",
  "polkadot-sdk/pallet-authority-discovery",
  "polkadot-sdk/sp-application-crypto",
  "polkadot-sdk/frame-system",
  "polkadot-sdk/frame-support",
  "polkadot-sdk/frame-executive",
  "polkadot-sdk/frame-system-rpc-runtime-api",
  "codec/std",
  "scale-info/std",
  "serde/std",
  "pallet-balances/std",
  "pallet-authorship/std",
  "pallet-im-online/std",
  "pallet-collective/std",
  "pallet-membership/std",
  "pallet-timestamp/std",
  "pallet-sudo/std",
  "pallet-transaction-payment/std",
  "pallet-insecure-randomness-collective-flip/std",
  "pallet-session/std",
  "pallet-staking/std",
  "pallet-transaction-payment-rpc-runtime-api/std",
  "pallet-treasury/std",
  "pallet-offences/std",
  "identity/std",
  "settings/std",
  "asset-registry/std",
  "audits/std",
  "audits-runtime-api/std",
  "asset-registry-runtime-api/std",
  "identity-runtime-api/std",
  "groups/std",
  "groups-runtime-api/std",
  "provenance-runtime-api/std",
  "settings-runtime-api/std",
  "provenance/std",
  "pallet-babe/std",
  "pallet-aura/std",
  "pallet-grandpa/std",
  "pallet-proxy/std",
  "substrate-validator-set/std",
]

grandpa_aura = [
  "pallet-aura",
  "pallet-grandpa",
  "pallet-session",
  "pallet-im-online",
  "pallet-authority-discovery",
  "polkadot-sdk/sp-consensus-aura",
]
grandpa_babe = [
  "pallet-babe",
  "pallet-grandpa",
  "pallet-session",
  "pallet-offences",
  "pallet-staking",
  "pallet-staking-reward-curve",
  "pallet-im-online",
  "pallet-authority-discovery",
  "polkadot-sdk/sp-consensus-babe",
]
instant_seal = []

runtime-benchmarks = [
  "polkadot-sdk/runtime-benchmarks",
  "polkadot-sdk/frame-benchmarking",
  "polkadot-sdk/frame-support",
  "polkadot-sdk/frame-system-benchmarking",
  "polkadot-sdk/frame-system",
  "hex-literal",
  "pallet-balances/runtime-benchmarks",
  "pallet-timestamp/runtime-benchmarks",
  "pallet-collective/runtime-benchmarks",
  "identity/runtime-benchmarks",
  "settings/runtime-benchmarks",
  "asset-registry/runtime-benchmarks",
  "audits/runtime-benchmarks",
  "groups/runtime-benchmarks",
  "provenance/runtime-benchmarks",
]

try-runtime = [
  "polkadot-sdk/try-runtime",
  "pallet-authorship/try-runtime",
  "pallet-balances/try-runtime",
  "pallet-collective/try-runtime",
  "pallet-membership/try-runtime",
  "pallet-sudo/try-runtime",
  "pallet-timestamp/try-runtime",
  "pallet-transaction-payment/try-runtime",
  "pallet-treasury/try-runtime",
  "pallet-insecure-randomness-collective-flip/try-runtime",
  "pallet-proxy/try-runtime",
  "pallet-aura/try-runtime",
  "pallet-grandpa/try-runtime",
  "pallet-session/try-runtime",
  "pallet-im-online/try-runtime",
  "pallet-authority-discovery/try-runtime",
  "asset-registry/try-runtime",
  "audits/try-runtime",
  "groups/try-runtime",
  "identity/try-runtime",
  "provenance/try-runtime",
  "settings/try-runtime",
]