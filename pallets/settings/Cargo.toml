[package]
authors = ["Borlaug Blockchain"]
edition = "2021"
name = "pallet-settings"
version = "2.0.0"

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
smallvec = { workspace = true }

polkadot-sdk = { workspace = true, default-features = false, features = ["runtime"] }

extrinsic-extra = { path = "../../traits/extrinsic_extra", default-features = false }

[dev-dependencies]
chrono = { workspace = true }
pallet-balances = { workspace = true }
runtime = { package = "borlaug-runtime", path = "../../runtime", features = ["std", "grandpa_aura"] }
serde = { workspace = true }


[features]
default = ["std"]
runtime-benchmarks = [
    "polkadot-sdk/frame-benchmarking"
]
std = [
    "polkadot-sdk/std",
    "polkadot-sdk/sp-std",
    "polkadot-sdk/frame-support",
    "polkadot-sdk/frame-system",
    "polkadot-sdk/sp-runtime",
    "polkadot-sdk/sp-arithmetic",
    "codec/std",
    "scale-info/std",
    "extrinsic-extra/std",
    "try-runtime"
]
try-runtime = [
    "polkadot-sdk/try-runtime"
]