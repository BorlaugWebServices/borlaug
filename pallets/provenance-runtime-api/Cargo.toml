[package]
authors = ["Borlaug"]
edition = "2021"
name = "provenance-runtime-api"
version = "0.0.1"

[dependencies]
codec = {workspace = true}

polkadot-sdk = { workspace = true, default-features = false, features = ["runtime"] }

primitives = {package = "pallet-primitives", path = "../primitives", default-features = false}

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["std"]
std = [
  "polkadot-sdk/std",
  "polkadot-sdk/sp-std",
  "polkadot-sdk/sp-api",
  "polkadot-sdk/frame-support",
  "codec/std",

]
